<script id="md" type="text/markdown"># Appendix

> Quick reference for both labs. See [Home](index.html) for lab access,
> [Lab 1](lab1-netdevops.html), and [Lab 2](lab2-security-iac.html).

## Appendix A — Credentials

| System | User | Password |
|--------|------|----------|
| code-server / GitLab / devbox / CML | see the [Home access table](index.html#lab-environment--access) | `C1sco12345` |
| Routers `csr1000v-0` / `iosv-1` | `admin` | `C1sco12345` |
| FMC & FTD | `admin` | `Cisco@123` |

> Secrets are **never** committed. Terraform reads `TF_VAR_fmc_password`, the REST
> script reads `FMC_PASSWORD`, and Ansible reads `FMC_PASSWORD` (or `ansible-vault`).

## Appendix B — Command cheat-sheet

```bash
# ---- Lab 1: NetDevOps ----
cd ~/automation_projects/clmel26_automation && source .venv/bin/activate
ansible-playbook ansible/playbooks/validate_vlans.yml        # offline intent check
pyats run job jobs/smoke_job.py --testbed-file testbed/testbed.yaml   # on devbox

# ---- Lab 2: Security IaC ----
cd ~/automation_projects/cisco_security_iac && source .venv/bin/activate
( cd terraform && terraform init && terraform validate )     # Terraform
python rest_api/fmc_access_policy.py --dry-run && ( cd rest_api && pytest )   # REST
( cd ansible && ansible-galaxy collection install -r requirements.yml \
  && ansible-playbook create_access_policy.yml --syntax-check )              # Ansible
```

## Appendix C — Troubleshooting

| Symptom | Likely cause | Fix |
|---------|--------------|-----|
| Pipeline fails at ping `192.168.1.1` | **Intentional** — interface on `iosv-0` is shut | `no shutdown` it (Lab 1.7) |
| `terraform init` can't download provider | No internet from host | Check proxy / registry reachability |
| pyATS SSH fails to a router | Legacy KEX/host-key | Already handled in `testbed.yaml` `ssh_options` |
| Ansible/REST auth error | Wrong `FMC_PASSWORD` | `export FMC_PASSWORD='Cisco@123'` |
| code-server hidden files showing | — | `files.exclude` hides dotfiles; reload the tab |
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script>
(function(){
  function slugify(t){
    return t.toLowerCase().trim().replace(/[^\w\s-]/g,"").replace(/\s/g,"-");
  }
  var src = document.getElementById("md").textContent;
  marked.setOptions({gfm:true, breaks:false, headerIds:false, mangle:false});
  var content = document.getElementById("content");
  content.innerHTML = marked.parse(src);

  // Give every heading a GitHub-style id so the in-page TOC anchors resolve.
  var used = {};
  content.querySelectorAll("h1,h2,h3,h4,h5,h6").forEach(function(h){
    var id = slugify(h.textContent); if(used[id]){used[id]++; id=id+"-"+used[id];} else {used[id]=1;}
    h.id = id;
  });

  // Convert ```mermaid code blocks into <div class="mermaid"> (decoded text).
  content.querySelectorAll("code.language-mermaid").forEach(function(code){
    var div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = code.textContent;
    code.parentNode.replaceWith(div);
  });
  try{
    mermaid.initialize({startOnLoad:false, theme:"default", securityLevel:"loose"});
    mermaid.run({querySelector:".mermaid"});
  }catch(e){console.error("mermaid",e);}

  // Highlight non-mermaid code blocks.
  content.querySelectorAll("pre code").forEach(function(el){
    if(!el.classList.contains("language-mermaid")){ try{hljs.highlightElement(el);}catch(e){} }
  });

  // Build the in-page TOC from h2 + h3.
  var toc = document.getElementById("toc");
  content.querySelectorAll("h2,h3").forEach(function(h){
    var a = document.createElement("a");
    a.href = "#"+h.id; a.textContent = h.textContent;
    if(h.tagName==="H3") a.className="lvl3";
    toc.appendChild(a);
  });

  // Active-link highlighting on scroll.
  var links = Array.prototype.slice.call(toc.querySelectorAll("a"));
  var map = {}; links.forEach(function(a){ map[a.getAttribute("href").slice(1)] = a; });
  var obs = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){
        links.forEach(function(l){l.classList.remove("active");});
        var a = map[en.target.id]; if(a){a.classList.add("active");
          a.scrollIntoView({block:"nearest"});}
      }
    });
  },{rootMargin:"0px 0px -75% 0px"});
  content.querySelectorAll("h2,h3").forEach(function(h){obs.observe(h);});

  // Mobile menu.
  var sb = document.getElementById("sidebar");
  document.getElementById("hamburger").addEventListener("click",function(){sb.classList.toggle("open");});
  toc.addEventListener("click",function(){sb.classList.remove("open");});

  // Theme toggle (persisted).
  var stored = null; try{ stored = localStorage.getItem("labguide-theme"); }catch(e){}
  if(stored){ document.documentElement.setAttribute("data-theme", stored); }
  document.getElementById("theme-toggle").addEventListener("click",function(){
    var htmlEl = document.documentElement;
    var next = htmlEl.getAttribute("data-theme")==="dark" ? "light" : "dark";
    htmlEl.setAttribute("data-theme", next);
    try{ localStorage.setItem("labguide-theme", next); }catch(e){}
  });
})();
</script>
