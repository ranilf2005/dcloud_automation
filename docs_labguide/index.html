> **Audience:** Network & security engineers attending the automation labs.

## Before you begin

**Prerequisites**

- Basic familiarity with the CLI, Git, and Cisco IOS / firewall concepts.
- No prior Terraform/Ansible/pyATS experience required — every command is given.

**Golden rule of this training:** *infrastructure as code*. You never log in to a
device and type commands by hand (except for the one deliberate troubleshooting
step in Lab 1). Instead you **describe intent in a file**, a pipeline **tests** it,
and only a passing test is **applied** to the device.

```mermaid
flowchart LR
  A[Describe intent<br/>in a file] --> B[Automated test]
  B -->|pass| C[Apply to device]
  B -->|fail| D[Stop · fix · retry]
  D --> A
```

## The codebase server IDE (code-server)

**code-server is your IDE for this entire training** — a full **Visual Studio Code
running in your browser**. All editing, terminals, Git, and test runs for **both
labs** happen here; there is nothing to install on your laptop.

| Property | Value |
|----------|-------|
| URL | **https://198.18.1.18:8080** (self-signed TLS — accept the warning once) |
| Password | `C1sco12345` |
| Version | code-server 4.129.0 (VS Code 1.129) |
| Opens in | `/home/cisco/` with a dark theme |
| Projects | `~/automation_projects/clmel26_automation/` and `~/automation_projects/cisco_security_iac/` |

**Pre-installed language support:** Python (Ruff, Black, Flake8, Mypy, debugpy),
Ansible, Terraform / HCL, YAML, XML, JSON, Jinja2, HTML/CSS, Docker, GitLab
Workflow, Markdown, and shell — so every file in these labs is highlighted, linted,
and auto-completed out of the box.

### Sign in and get oriented

1. Open **https://198.18.1.18:8080** in your browser. It uses a **self-signed
   certificate**, so accept the browser warning once (**Advanced ▸ Proceed to
   198.18.1.18**). HTTPS is what makes **copy/paste and the clipboard** work in the
   IDE. Then enter the password `C1sco12345`.
2. The **Explorer** on the left opens on `/home/cisco/`. Hidden dot-files are
   hidden, so you only see your working folders — expand **`automation_projects/`**
   to find the two labs.
3. Open the integrated terminal with **Terminal ▸ New Terminal** (or press
   `` Ctrl+` ``). **Every command in this guide is run in this terminal.**

### Make every change here (the "as code" loop)

1. **Edit** an intent file — for example
   `clmel26_automation/ansible/vars/vlans.yml` or a file under
   `cisco_security_iac/` — and save with `Ctrl+S`.
2. **Test / validate** from the integrated terminal (pyATS, `ansible-playbook`,
   `terraform validate`, `pytest`, …).
3. **Commit and push** using the built-in **Source Control** panel or `git` in the
   terminal. In Lab 1 the push triggers the GitLab pipeline automatically.

> Throughout this guide, whenever you read *"open a terminal"* or *"edit the
> file"*, do it **in code-server**.

```mermaid
flowchart LR
  E[Edit file<br/>in code-server] --> S[Save]
  S --> T[Run tests in the<br/>integrated terminal]
  T --> G[Commit + push<br/>Source Control]
  G --> P[Pipeline runs]
```

      var STRING = {className:"string", begin:'"', end:'"',
        contains:[{className:"subst", begin:/\$\{/, end:/\}/}, hl.BACKSLASH_ESCAPE]};
      return {
        name:"HCL", aliases:["tf","terraform"],
        keywords:{
          keyword:"resource variable output provider module data terraform locals dynamic for_each count depends_on lifecycle",
          literal:"true false null"
        },
        contains:[
          hl.HASH_COMMENT_MODE,
          hl.COMMENT(/\/\//, /$/),
          hl.COMMENT(/\/\*/, /\*\//),
          STRING,
          {className:"number", begin:/\b\d+(\.\d+)?/, relevance:0},
          {className:"attr", begin:/[\w-]+(?=\s*=[^=])/},
          {className:"built_in", begin:/\b(var|local|module|data|path|each|self)(?=\.)/}
        ]
      };
    });
  }catch(e){}

  // Highlight known languages only (unknown ones render clean plain text).
  content.querySelectorAll("pre code").forEach(function(el){
    if(el.classList.contains("language-mermaid")) return;
    var m = (el.className.match(/language-([\w-]+)/) || [])[1];
    if(m && !hljs.getLanguage(m)) return;
    try{hljs.highlightElement(el);}catch(e){}
  });

  // Copy button on every code block.
  content.querySelectorAll("pre").forEach(function(pre){
    var code = pre.querySelector("code"); if(!code) return;
    var btn = document.createElement("button");
    btn.className="copy-btn"; btn.type="button"; btn.textContent="Copy";
    btn.setAttribute("aria-label","Copy code to clipboard");
    btn.addEventListener("click", function(ev){
      ev.preventDefault();
      var text = code.textContent;
      function ok(){ btn.textContent="Copied!"; btn.classList.add("copied");
        setTimeout(function(){ btn.textContent="Copy"; btn.classList.remove("copied"); },1500); }
      function fallback(){ try{ var r=document.createRange(); r.selectNodeContents(code);
        var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
        document.execCommand("copy"); s.removeAllRanges(); ok(); }catch(e){} }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(ok).catch(fallback);
      } else { fallback(); }
    });
    pre.appendChild(btn);
  });

  // Expand / collapse all for pages with collapsible file blocks.
  var files = content.querySelectorAll("details.file");
  if(files.length){
    var bar = document.createElement("div"); bar.className="details-tools";
    bar.innerHTML = '<button type="button" data-act="open">Expand all</button>'
                  + '<button type="button" data-act="close">Collapse all</button>';
    var h1 = content.querySelector("h1");
    if(h1 && h1.nextSibling) h1.parentNode.insertBefore(bar, h1.nextSibling.nextSibling || null);
    else content.insertBefore(bar, content.firstChild);
    bar.addEventListener("click", function(e){
      var b = e.target.closest("button"); if(!b) return;
      var open = b.getAttribute("data-act")==="open";
      files.forEach(function(d){ d.open = open; });
    });
  }

  // In-page table of contents — nested & collapsible: each H2 topic can fold its
  // H3 sub-topics, and a master toggle folds the whole list.
  var toc = document.getElementById("page-toc");
  if(toc){
    var curSec = null, curKids = null;
    content.querySelectorAll("h2,h3").forEach(function(h){
      var a = document.createElement("a");
      a.href = "#"+h.id; a.textContent = h.textContent;
      if(h.tagName==="H2"){
        var sec = document.createElement("div"); sec.className="toc-sec";
        var row = document.createElement("div"); row.className="toc-row";
        var kids = document.createElement("div"); kids.className="toc-children";
        var tg = document.createElement("button");
        tg.className="toc-toggle"; tg.type="button";
        tg.setAttribute("aria-label","Toggle sub-topics");
        tg.innerHTML="<span>&rsaquo;</span>";
        (function(s){ tg.addEventListener("click", function(e){
          e.preventDefault(); e.stopPropagation(); s.classList.toggle("collapsed");
        }); })(sec);
        row.appendChild(tg); row.appendChild(a);
        sec.appendChild(row); sec.appendChild(kids); toc.appendChild(sec);
        curSec = sec; curKids = kids;
      } else {
        a.className="lvl3";
        if(curKids){ curKids.appendChild(a); } else { toc.appendChild(a); }
      }
    });
    // Hide the toggle on H2 topics that have no sub-topics (keeps alignment).
    toc.querySelectorAll(".toc-sec").forEach(function(s){
      if(!s.querySelector(".toc-children").children.length){
        var t = s.querySelector(".toc-toggle"); if(t) t.classList.add("empty");
      }
    });
    // Master toggle: show/hide the whole contents list.
    var master = document.querySelector(".toc-master");
    if(master){
      if(!toc.children.length){ master.style.display="none"; }
      master.addEventListener("click", function(e){
        e.preventDefault();
        var collapsed = master.classList.toggle("collapsed");
        toc.style.display = collapsed ? "none" : "";
        master.setAttribute("aria-expanded", collapsed ? "false" : "true");
      });
    }
    // Scroll-spy: highlight the current heading (and reveal its section).
    var links = Array.prototype.slice.call(toc.querySelectorAll("a"));
    var map = {}; links.forEach(function(a){ map[a.getAttribute("href").slice(1)] = a; });
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){
          links.forEach(function(l){l.classList.remove("active");});
          var a = map[en.target.id];
          if(a){
            a.classList.add("active");
            var sec = a.closest(".toc-sec"); if(sec) sec.classList.remove("collapsed");
            a.scrollIntoView({block:"nearest"});
          }
        }
      });
    },{rootMargin:"0px 0px -75% 0px"});
    content.querySelectorAll("h2,h3").forEach(function(h){obs.observe(h);});
  }

  // Collapsible sidebar groups.
  document.querySelectorAll(".nav-group-h").forEach(function(btn){
    btn.addEventListener("click", function(){
      var g = btn.parentNode; var open = g.classList.toggle("open");
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    });
  });

  // Mobile menu.
  var sb = document.getElementById("sidebar"), scrim = document.getElementById("scrim");
  function closeMenu(){ sb.classList.remove("open"); scrim.classList.remove("show"); }
  document.getElementById("hamburger").addEventListener("click", function(){
    sb.classList.toggle("open"); scrim.classList.toggle("show");
  });
  scrim.addEventListener("click", closeMenu);
  document.getElementById("pages").addEventListener("click", function(e){
    if(e.target.closest("a")) closeMenu();
  });

  // Scroll progress bar + back-to-top.
  var prog = document.getElementById("progress"), toTop = document.getElementById("toTop");
  function onScroll(){
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    var pct = max > 0 ? (h.scrollTop / max) * 100 : 0;
    prog.style.width = pct + "%";
    if(h.scrollTop > 400) toTop.classList.add("show"); else toTop.classList.remove("show");
  }
  window.addEventListener("scroll", onScroll, {passive:true}); onScroll();
  toTop.addEventListener("click", function(){ window.scrollTo({top:0, behavior:"smooth"}); });

  // Theme toggle (persisted).
  var stored = null; try{ stored = localStorage.getItem("labguide-theme"); }catch(e){}
  if(stored){ document.documentElement.setAttribute("data-theme", stored); }
  document.getElementById("theme-toggle").addEventListener("click", function(){
    var el = document.documentElement;
    var next = el.getAttribute("data-theme")==="dark" ? "light" : "dark";
    el.setAttribute("data-theme", next);
    try{ localStorage.setItem("labguide-theme", next); }catch(e){}
  });
})();
</script>
</body>
</html>
